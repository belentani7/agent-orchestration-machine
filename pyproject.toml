[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestration-machine"
version = "0.1.0"
description = "Núcleo headless y multiinquilino para orquestación segura de agentes."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
machine = "machine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
