name: Verify core

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.11 tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run core health check
        env:
          PYTHONPATH: src
        run: python -m machine --health
      - name: Set up Node for local console tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate private portfolio console
        run: node --test site/portfolio.test.mjs
      - name: Check console module syntax
        run: |
          node --check site/app.mjs
          node --check site/portfolio.mjs
