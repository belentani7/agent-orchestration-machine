name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-orchestration-machine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Health check
        run: PYTHONPATH=src python -m machine --health
      - name: Demo
        run: PYTHONPATH=src python -m machine --demo
