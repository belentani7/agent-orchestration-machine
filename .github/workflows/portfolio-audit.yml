name: Portfolio inventory and readiness
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */4 * * *"
permissions:
  contents: read
concurrency:
  group: portfolio-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install project package
        run: python -m pip install --no-deps -e .
      - name: Verify portfolio unit tests
        run: python -m unittest discover -s tests -v
      - name: Read-only inventory
        env:
          PORTFOLIO_OWNER: belentani7
          PORTFOLIO_AUDIT_TOKEN: ${{ secrets.PORTFOLIO_AUDIT_TOKEN }}
          MAX_REPOS: "1000"
          MAX_CONTENT_CHECKS: "120"
        run: python scripts/portfolio_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-audit
          path: artifacts/portfolio/
          retention-days: 14
          if-no-files-found: warn
